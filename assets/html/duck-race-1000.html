<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
	<title>Duck Race 1000 - Game Đua Vịt</title>
	<link href="/css/racetimer.css" rel="stylesheet" type="text/css">
    <link href="/css/newrace.css?v=070626184009" rel="stylesheet" type="text/css">
    <style type="text/css">
    #countInput
    {
		text-align: center;
		font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(1rem, 5vw, 2rem);
	}
    </style>
    <script src="/js/WorkerTimers.js"></script>
    <script src="/js/createjs.js?v=070626184009"></script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="/js/jquery.blockUI.js?v=070626184009"></script>
	<script src="/js/timerfix.js?v=070626184009"></script>
	<script src="/js/prototypes.js?v=070626184009"></script>
    <script src="/js/helpers.js?v=070626184009"></script>
    <script src="/js/language.js?v=070626184009"></script>
    <script src="/js/server.js?v=070626184009"></script>
	<script src="/js/snippets.js?v=070626184009"></script>
    <script src="/js/slider.js?v=070626184009"></script>
    <script src="/js/cache.js?v=070626184009"></script>
    <script src="/js/sound.js?v=070626184009"></script>
    <script src="/js/settings.js?v=070626184009"></script>
    <script src="/js/keyboard.js?v=070626184009"></script>
    <script src="/js/timermenu.js?v=070626184009"></script>
    <script src="/js/listwinners.js?v=070626184009"></script>
    <script src="/js/userlogo.js?v=070626184009"></script>
    <script src="/js/main.js?v=070626184009"></script>
	<script src="/js/index.js?v=070626184009"></script>
    <script>

var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation, lib, loader, AdobeAn0,AdobeAn1000;
function urlSettings() {
    return {
        language: 'english',
        logo: null,
        volume: 100,
        userType: true,
        ownLogo: false,
        display: 'MM:SS',
        sounds: [],
        ns: 'duck',
        nslen: 3,
        countdown: '00:00:10',
        clock: '',
        clockType: '',
        bubble: 'false',
        c: 1,
        loadingChunks: 5,
        loadingDelay: 100,
        characters: 5,
        musicOff: 'false',
        sfxOff: 'false',
        characterStyle: 'default'
    };
}
var urlData=urlSettings();
function reCreateManifest(manifest)
{
    var i;

    for (i=0;i<manifest.length;i++)
    {
        if (/.*?jquery.*?\.js/.test(manifest[i].id))
        {
            manifest.splice(i, 1);
            break;
        }
    }

    for (i=0;i<manifest.length;i++)
    {

        if (/.*?anwidget.*?\.js/.test(manifest[i].id))
        {
            manifest[i].src= "/components/sdk/anwidget.js?v=070626184009";
            break;
        }
    }
    return manifest;
}

function init()
{
	$("canvas").hide();
    anim_container = document.getElementById("animation_container");
	dom_overlay_container = document.getElementById("dom_overlay_container");
	var comp=AdobeAn.getComposition("82FF19653FF5584EBED3897B2F75DA5A");
    lib=comp.getLibrary();
    canvas = createHiPPICanvas(lib.properties.width, lib.properties.height);
    canvas.oncontextmenu = function() {return false;}
	createjs.MotionGuidePlugin.install();
	loader = new createjs.LoadQueue(true);
	loader.installPlugin(createjs.Sound);
	loader.addEventListener("fileload", function(evt){handleFileLoad(evt,comp)});
	loader.addEventListener("complete", function(evt){handleComplete(evt,comp)});
	loader.addEventListener("progress", function(evt){handleProgress(evt,comp)});
	loader.addEventListener("error", function(evt){handleError(evt,comp)});

    lib.properties.manifest.push({id:"sounds", src:"/json/sounds.json"});
    lib.properties.manifest=reCreateManifest(lib.properties.manifest);
    lib.properties.manifest.push({id:"cheer0", src:"/audio/cheer.mp3"});
    lib.properties.manifest.push({id:"airhorn0", src:"/audio/airhorn.mp3"});
    lib.properties.manifest.push({id:"duck0", src:"/audio/duck0.mp3"});
    lib.properties.manifest.push({id:"duck1", src:"/audio/duck1.mp3"});
    lib.properties.manifest.push({id:"duck2", src:"/audio/duck2.mp3"});
    lib.properties.manifest.push({id:"premium1000", src:'/js/premium1000.js',crossOrigin:"Anonymous"});
    loadFinalManifestAWS(function (){loader.loadManifest(lib.properties.manifest);});
}
function handleError(evt, comp)
{
	if (evt.data.type==="sound") urlData.ns=null;
	if (evt.data.type==="text") urlData.language=null;
}
function handleProgress(evt, comp)
{
	$("#loader").html(Math.round(evt.progress*100)+"% loaded");
}
function handleFileLoad(evt, comp)
{
	var images=comp.getImages();
	if (evt && (evt.item.type === "image")) { images[evt.item.id] = evt.result; }
}
function handleComplete(evt,comp)
{
    loader.removeAllEventListeners();
    $("#loader").html("wait, initializing...");
	var ss=comp.getSpriteSheet();
	var queue = evt.target;
	var ssMetadata = lib.ssMetadata;
	for(var i=0; i<ssMetadata.length; i++)
	{
		ss[ssMetadata[i].name] = new createjs.SpriteSheet( {"images": [queue.getResult(ssMetadata[i].name)], "frames": ssMetadata[i].frames} )
	}
	exportRoot = new lib.index();
	stage = new lib.Stage(canvas);

	createjs.Touch.enable(stage);

    if (!urlData) urlData = { language: 'english', logo: null, volume: 100, userType: true, ownLogo: false };
    try {
      urlData.language=(urlData.language!=="english" && queue.getResult("language"))?JSON.parse(queue.getResult("language")):null;
    } catch(e) { urlData.language = null; }
    urlData.logo=queue.getResult("logo");
    var soundsRes = queue.getResult("sounds");
    urlData.sounds=soundsRes && soundsRes.sounds ? soundsRes.sounds : [];

	if (AdobeAn0)
    {
        var comp0=AdobeAn0.getComposition("0FE374AEF6761E4CBF0E4792A1297DA6");
        var lib0=comp0.getLibrary();
        urlData.premium0=new lib0.Premium0();
    }

    if (AdobeAn1000)
    {
        var comp1000=AdobeAn1000.getComposition("7B005B36460FE74F8BF7410B8A8405A3");

        var lib1000=comp1000.getLibrary();
        urlData.premium1000=new lib1000.Premium1000();
    }


	fnStartAnimation = function()
    {
		stage.addChild(exportRoot);
		createjs.Ticker.framerate = lib.properties.fps;
		createjs.Ticker.addEventListener("tick", stage);
	};

	AdobeAn.makeResponsive = function(isResp, respDim, isScale, scaleType, domContainers)
    {
        var lastW, lastH, lastS=1;
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        function resizeCanvas()
        {
            var w = lib.properties.width, h = lib.properties.height;
            var iw = window.innerWidth, ih=window.innerHeight;
            var pRatio = window.devicePixelRatio || 1, xRatio=iw/w, yRatio=ih/h, sRatio=1;
            if(isResp)
            {
                if((respDim=='width'&&lastW==iw) || (respDim=='height'&&lastH==ih))
                {
                    sRatio = lastS;
                }
                else if(!isScale)
                {
                    if(iw<w || ih<h)
                        sRatio = Math.min(xRatio, yRatio);
                }
                else if(scaleType==1)
                {
                    sRatio = Math.min(xRatio, yRatio);
                }
                else if(scaleType==2)
                {
                    sRatio = Math.max(xRatio, yRatio);
                }
            }
            domContainers[0].width = w * pRatio * sRatio;
            domContainers[0].height = h * pRatio * sRatio;
            domContainers.forEach(function(container)
            {
                container.style.width = w * sRatio + 'px';
                container.style.height = h * sRatio + 'px';
            });

            domContainers[0].getContext("2d").scale(pRatio * sRatio, pRatio * sRatio);

            stage.scaleX = pRatio*sRatio;
            stage.scaleY = pRatio*sRatio;
            lastW = iw; lastH = ih; lastS = sRatio;
            stage.tickOnUpdate = false;
            stage.update();
            stage.tickOnUpdate = true;
        }
    }

AdobeAn.makeResponsive(true,'both',true,1,[canvas,anim_container,dom_overlay_container]);
	AdobeAn.compositionLoaded(lib.properties.id);
	fnStartAnimation();

	setTimeout(function()
	{
		Main(urlData);
		setTimeout(function() {
			if (typeof exportRoot !== 'undefined' && exportRoot.settings) {
				exportRoot.settings.visible = false;
				if (typeof $ !== 'undefined') {
					$("#titleInput").hide();
					$("#namesList").hide();
					$("#countInput").hide();
					$("#selectDrop").hide();
				}
			}
		}, 300);
	},300);
}
</script>
</head>
<body onload="init();" style="margin:0;">
	<div id="animation_container" style="background-color:rgba(255, 255, 255, 1.00); width:942px; height:530px">
		<canvas id="canvas" width="942" height="530" style="position: absolute; display: block; background-color:rgba(255, 255, 255, 1.00);"></canvas>
		<div id="dom_overlay_container" style="pointer-events:none; overflow:hidden; width:942px; height:530px; position: absolute; left: 0px; top: 0px; display: block;">
		</div>
	</div>
	<div id="loader">Loading...</div>
</body>
</html>
